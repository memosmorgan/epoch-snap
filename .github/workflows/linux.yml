name: Linux ordinary checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with formatting and Clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - name: Kernel coverage disclosure
        run: echo 'UFFD WP tests and WP example smoke are ignored here. This runner has no established WP capability; CI reports ordinary coverage only.'
